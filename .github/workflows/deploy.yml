name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/npm.log; exit ${PIPESTATUS[0]}

      - name: Post install log on failure
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "=== NPM LOG ==="
          cat /tmp/npm.log
          echo "=== PASTE URL ==="
          cat /tmp/npm.log | curl -s -F "sprunge=<-" http://sprunge.us || true

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
