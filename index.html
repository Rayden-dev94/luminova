<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LUMINOVA Intro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

  <style>
    html, body {width: 100%; max-width: 100%; overflow-x: clip; }
    @supports not (overflow: clip) { html, body { overflow-x: hidden; } }
    body { background: radial-gradient(circle at 50% 10%, #eceff2 100%); overflow: hidden; }

    main { perspective: 1200px; overflow-x: clip; position: relative; }
    .slide { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
    .slide img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

    #showcase { contain: layout paint; backface-visibility: hidden; overflow: hidden; opacity: 1; z-index: 5; visibility: hidden; }
    #brand { z-index: 10; gap: 0 !important; }

    #brandMask { position: absolute; inset: 0; background: radial-gradient(circle at 50% 10%, #eceff2 100%); z-index: 7; pointer-events: none; will-change: opacity; opacity: 1; }

    #lumi, #nova {
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: inherit; color: #1f2937;
      background: radial-gradient(circle at 50% 10%, #eceff2 100%);
      line-height: 1; width: min(45vw, 380px); height: min(30vh, 540px);
      padding: 2vw 1vw; box-sizing: border-box; will-change: transform; margin: 0;
    }

    .smoke { color: rgba(31,41,55,.92); text-shadow: 0 10px 30px rgba(0,0,0,.35); letter-spacing: .02em; }
    #wevin { color: rgba(55,65,81,.9); font-weight: 700; text-shadow: 0 4px 15px rgba(0,0,0,.25); }

    #menuLinks { visibility: hidden; pointer-events: none; z-index: 40; }
    #menuLinks ul {
      background-color: rgba(255,255,255,0.06);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 0 25px rgba(0,0,0,0.15);
    }
    #menuLinks ul li { opacity: 0; transform: translateY(8px); }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    /* —— viewport & fullscreen —— */
    :root { --vh: 100dvh; --bleed: 0px; }
    .fullscreen-layer {
      position: fixed; left: 0; top: 0; width: 100vw;
      height: 100lvh;
      height: var(--vh);
      overflow: hidden; z-index: 5; pointer-events: none; will-change: transform;
    }
    .fullscreen-layer img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; will-change: transform;
    }
    /* Bleed su mobile */
    @media (max-width: 480px) {
      :root { --bleed: 14vh; }
      .fullscreen-layer img { height: calc(100% + var(--bleed)); top: calc(var(--bleed) / -2); }
    }

    /* --------- MOBILE (<=480px) --------- */
    @media (max-width: 480px) {
      #brand { font-size: clamp(6px, 4vw, 28px) !important; letter-spacing: .02em; line-height: 1.02; }
      #lumi, #nova { width: 26vw; height: 244px; padding: 1.2vw 0.8vw; }
      #preTitle { font-size: clamp(20px, 7.5vw, 32px) !important; }
      #showcase { width: 46vw !important; max-width: 78vw !important; }

      /* —— Alza il badge su telefono —— */
      #wevin {
        /* più lontano dal bordo basso = più in alto */
        bottom: calc(18vh + env(safe-area-inset-bottom, 0px));
        right: 6px;
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">
  <main class="relative flex items-center justify-center w-full h-screen">
    <div id="brand" role="heading" aria-level="1"
      class="font-extrabold text-6xl sm:text-8xl tracking-widest text-gray-900 flex items-center justify-center gap-8 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
      <p id="lumi" class="inline-block">LUMI</p>
      <p id="nova" class="inline-block">NOVA</p>
    </div>

    <div id="brandMask" aria-hidden="true"></div>

    <h1 id="preTitle"
      class="fixed top-6 left-1/2 -translate-x-1/2 z-30 font-extrabold tracking-tight smoke opacity-0 select-none pointer-events-none
             text-center uppercase w-[min(92vw,1200px)] text-[clamp(36px,9vw,110px)]"
      aria-hidden="true" style="text-wrap: balance;">
      LUMI&nbsp;NOVA
    </h1>

    <h1 id="finalTitle"
      class="fixed left-1/2 -translate-x-1/2 z-20 font-extrabold tracking-tight smoke opacity-0 select-none pointer-events-none
             text-center w-[min(92vw,1100px)] text-[clamp(20px,6vw,42px)]
             sm:text-5xl md:text-6xl"
      aria-hidden="true"
      style="top: clamp(180px, 36vh, 520px); text-wrap: balance;">
      Let’s build something to remember
    </h1>

    <h2 id="wevin"
      class="fixed right-8 text-2xl sm:text-3xl md:text-4xl font-bold opacity-0 select-none pointer-events-none z-20"
      style="color: #f5f0e6; text-shadow: 0 4px 15px rgba(0,0,0,.25); bottom: calc(50px + env(safe-area-inset-bottom, 0px));"
      aria-hidden="true">
      Concept Design by Wevin&nbsp;<span class="align-super text-lg">©</span>
    </h2>

    <div id="showcase" class="flex items-center justify-center w-[300px] max-w-[80vw] aspect-[16/9] z-[5]">
      <div class="slide"><img src="img/img1.jpg" alt="Luminova 1" /></div>
      <div class="slide"><img src="img/img2.jpg" alt="Luminova 2" /></div>
      <div class="slide"><img src="img/img3.jpg" alt="Luminova 3" /></div>
      <div class="slide"><img src="img/img4.jpg" alt="Luminova 4" /></div>
      <div class="slide"><img src="img/img5.jpg" alt="Luminova 5" /></div>
    </div>

    <nav id="menuLinks" class="fixed inset-0 flex items-center justify-center select-none"
      aria-label="Menu principale" aria-hidden="true">
      <ul class="flex flex-col sm:flex-row items-center gap-3 sm:gap-5 text-xl sm:text-2xl font-semibold tracking-wide rounded-2xl px-6 py-3">
        <li><a href="#project"  class="px-2 py-1 text-gray-700 hover:text-white transition-colors duration-300">Project</a></li>
        <li><a href="#services" class="px-2 py-1 text-gray-700 hover:text-white transition-colors duration-300">Services</a></li>
        <li><a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="px-2 py-1 text-gray-700 hover:text-white transition-colors duration-300">Github</a></li>
      </ul>
    </nav>
  </main>

  <script>
    let __finalized = false;

    function setRealVhVar() {
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight; // evita salti con toolbar
      document.documentElement.style.setProperty('--vh', h + 'px');
    }
    document.addEventListener("DOMContentLoaded", () => { setRealVhVar(); init(); }, { passive: true });
    window.addEventListener('resize', setRealVhVar, { passive: true });
    window.addEventListener('orientationchange', setRealVhVar, { passive: true });

    function responsiveGap() {
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const isPhone = vw <= 480;
      const g = Math.round(vw * 0.025);
      return isPhone ? Math.max(6, Math.min(g, 16)) : Math.max(16, Math.min(g, 50));
    }

    function preloadImages(imgNodes) {
      const toPromise = (img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        if ('decode' in img) return img.decode().catch(() => {});
        return new Promise((res) => { img.addEventListener('load', res, { once: true }); img.addEventListener('error', res, { once: true }); });
      };
      return Promise.all(Array.from(imgNodes).map(toPromise));
    }

    async function init() {
      const main = document.querySelector('main');
      const lumi = document.getElementById("lumi");
      const nova = document.getElementById("nova");
      const showcase = document.getElementById("showcase");
      const slides = showcase.querySelectorAll(".slide");
      const preTitle = document.getElementById("preTitle");
      const finalTitle = document.getElementById("finalTitle");
      const wevin = document.getElementById("wevin");
      const menuLinks = document.getElementById("menuLinks");
      const menuItems = menuLinks.querySelectorAll("li");
      const brandMask = document.getElementById("brandMask");

      const coverImg = slides[0].querySelector('img');
      const preloadCover = preloadImages([coverImg]);
      const preloadReveal = preloadImages([slides[3].querySelector('img')]);
      const preloadAll = preloadImages(showcase.querySelectorAll('img')); // opzionale

      gsap.set(slides[0], { autoAlpha: 1 });

      await new Promise((resolve) => {
        gsap.timeline({ defaults: { ease: "power3.out" } })
          .fromTo(lumi, { yPercent: -160, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6 })
          .fromTo(nova, { yPercent: 160,  opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6 }, "<0.05")
          .add(resolve);
      });

      try { await preloadCover; } catch {}

      const { lumiRect, novaRect, showcaseRect, GAP } = (() => ({
        lumiRect: lumi.getBoundingClientRect(),
        novaRect: nova.getBoundingClientRect(),
        showcaseRect: showcase.getBoundingClientRect(),
        GAP: responsiveGap()
      }))();

      const lumiTargetX = showcaseRect.left - lumiRect.right - GAP;
      const novaTargetX = showcaseRect.right - novaRect.left + GAP;

      const tlSplit = gsap.timeline({ defaults: { ease: "power2.inOut" } });

      tlSplit.add(() => {
        showcase.style.visibility = 'visible';
        gsap.to(brandMask, { autoAlpha: 0, duration: 0.25, onComplete: () => brandMask.remove() });
      }, 0);

      tlSplit.to(lumi, { x: lumiTargetX, duration: 0.8 }, 0);
      tlSplit.to(nova, { x: novaTargetX, duration: 0.8 }, 0);

      tlSplit.add(() => startSlideshow(slides, {
        interval: 0.8,
        fade: 0.25,
        onThird: () => revealFullscreenFLIP({
          main, showcase, slides, lumi, nova, preTitle, finalTitle, wevin, menuLinks, menuItems, preloadReveal
        })
      }));
    }

    function startSlideshow(slides, { interval = 0.9, fade = 0.25, onThird = null } = {}) {
      let index = 0, total = slides.length, prev = slides[0], cancelled = false;

      const advance = () => {
        if (cancelled) return;
        const nextIndex = (index + 1) % total;
        const next = slides[nextIndex];

        gsap.to(prev, { autoAlpha: 0, duration: fade });
        gsap.to(next, { autoAlpha: 1, duration: fade });

        if (nextIndex === 3 && typeof onThird === "function") {
          cancelled = true;
          gsap.delayedCall(fade + 0.02, onThird);
          return;
        }

        prev = next; index = nextIndex;
        gsap.delayedCall(interval, advance);
      };

      gsap.delayedCall(0.02, advance);
      startSlideshow.stop = () => { cancelled = true; };
    }

    async function revealFullscreenFLIP({ main, showcase, slides, lumi, nova, preTitle, finalTitle, wevin, menuLinks, menuItems, preloadReveal }) {
      slides.forEach((s, i) => gsap.set(s, { autoAlpha: i === 3 ? 1 : 0 }));

      const activeImg = slides[3].querySelector('img');
      try { await preloadReveal; } catch {}

      const r = activeImg.getBoundingClientRect();

      const layer = document.createElement('div');
      layer.className = 'fullscreen-layer';

      const hi = document.createElement('img');
      hi.alt = activeImg.alt || '';
      hi.src = activeImg.currentSrc || activeImg.src;
      layer.appendChild(hi);
      main.appendChild(layer);

      showcase.style.visibility = 'hidden';

      const rectLayer = layer.getBoundingClientRect();
      const vw = rectLayer.width;
      const vh = rectLayer.height;

      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const vx = rectLayer.left + vw / 2;
      const vy = rectLayer.top + vh / 2;

      const scaleX = r.width / vw;
      const scaleY = r.height / vh;
      const translateX = cx - vx;
      const translateY = cy - vy;

      gsap.set(layer, { transformOrigin: '50% 50% 0', force3D: true, x: translateX, y: translateY, scaleX, scaleY });

      const tl = gsap.timeline({ defaults: { ease: 'power3.inOut' } });
      tl.to(lumi, { x: '-120vw', autoAlpha: 0, duration: 0.6 }, 0.02);
      tl.to(nova, { x: '120vw', autoAlpha: 0, duration: 0.6 }, 0.02);
      tl.to(layer, { duration: 0.7, x: 0, y: 0, scaleX: 1, scaleY: 1, force3D: true }, 0);

      tl.add(() => {
        __finalized = true;
        const ui = gsap.timeline({ defaults: { ease: 'power3.out' } });
        ui.add(() => preTitle.removeAttribute('aria-hidden'));
        ui.fromTo(preTitle, { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45 });

        const isPhone = (window.visualViewport ? window.visualViewport.width : window.innerWidth) <= 480;
        const placeFinalTitleMobile = (offset = 10) => {
          if (!isPhone) return;
          const preBottom = preTitle.getBoundingClientRect().bottom;
          finalTitle.style.top = `${Math.round(preBottom + offset)}px`;
        };

        ui.add(() => { placeFinalTitleMobile(10); finalTitle.removeAttribute('aria-hidden'); }, '+=0.1');
        ui.fromTo(finalTitle, { y: -12, opacity: 0 }, {
          y: 0, opacity: 1, duration: 0.6, onComplete: () => {
            menuLinks.removeAttribute('aria-hidden');
            menuLinks.style.visibility = 'visible';
            gsap.to(menuLinks.querySelectorAll('li'), {
              opacity: 1, y: 0, duration: 0.4, stagger: 0.08,
              onComplete: () => { menuLinks.style.pointerEvents = 'auto'; }
            });
          }
        });

        ui.add(() => {
          // Nota: la posizione finale di #wevin è gestita dal CSS; GSAP anima solo l'entrata.
          gsap.fromTo(wevin, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 });
          wevin.removeAttribute('aria-hidden');
        }, '+=0.2');
      });
    }

    window.addEventListener("resize", () => {
      if (!__finalized) return;
      if ((window.visualViewport ? window.visualViewport.width : window.innerWidth) > 480) return;
      const preTitle = document.getElementById("preTitle");
      const finalTitle = document.getElementById("finalTitle");
      const preBottom = preTitle.getBoundingClientRect().bottom;
      finalTitle.style.top = `${Math.round(preBottom + 10)}px`;
    }, { passive: true });
  </script>
</body>
</html>
